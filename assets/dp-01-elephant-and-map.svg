<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="曹冲称象与向量点积六大核心概念导览图">
  <title>曹冲称象与向量点积六大核心概念导览图</title>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#235884"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#9e3321"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4a4640"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#787167"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#256b45"/>
    </marker>
    
  </defs>
  <rect x="0.5" y="0.5" width="959" height="519" rx="10" fill="#fbf8f2" stroke="#d8d0c1"/>
  
  <text x="36" y="28" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#787167">FIG 01 · MENTAL MODEL &amp; ROADMAP</text>
  <text x="36" y="54" font-family="'Newsreader', 'Noto Serif SC', Georgia, serif" font-size="21" font-weight="700" fill="#191816">别先想计算：点积是「拿一样东西，去量另一样」</text>
  <line x1="36" y1="68" x2="924" y2="68" stroke="#d8d0c1" stroke-width="1"/>

  <!-- Left panel: Cao Chong weighs the elephant -->
  <rect x="36" y="88" width="444" height="398" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
  <text x="56" y="114" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#787167">CAO CHONG'S ELEPHANT · 曹冲称象</text>

  <!-- Vector formula -->
  <g transform="translate(60, 130)">
    <!-- [3 4 6] -->
    <path d="M 6 18 L 0 18 L 0 68 L 6 68" fill="none" stroke="#235884" stroke-width="1.8"/>
    <text x="20" y="50" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#235884">3</text>
    <text x="54" y="50" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#235884">4</text>
    <text x="88" y="50" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#235884">6</text>
    <path d="M 110 18 L 116 18 L 116 68 L 110 68" fill="none" stroke="#235884" stroke-width="1.8"/>
    <text x="58" y="88" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#235884">被量的（有几块石头）</text>

    <!-- Dot -->
    <circle cx="136" cy="43" r="4.5" fill="#9e3321"/>

    <!-- [600; 300; 50] -->
    <path d="M 162 2 L 154 2 L 154 84 L 162 84" fill="none" stroke="#9e3321" stroke-width="1.8"/>
    <text x="192" y="24" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#9e3321">600</text>
    <text x="192" y="49" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#9e3321">300</text>
    <text x="192" y="74" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#9e3321">50</text>
    <path d="M 222 2 L 230 2 L 230 84 L 222 84" fill="none" stroke="#9e3321" stroke-width="1.8"/>
    <text x="192" y="104" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#9e3321">尺子（每块多重 kg）</text>

    <!-- = 3300 kg -->
    <text x="248" y="50" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#191816">= 3300 kg</text>
  </g>

  <!-- Step breakdown pill -->
  <rect x="58" y="250" width="400" height="32" rx="5" fill="#fbf8f2" stroke="#d8d0c1"/>
  <text x="258" y="271" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#4a4640">3×600 + 4×300 + 6×50 = 1800 + 1200 + 300 = 3300 kg</text>

  <!-- Water & boats illustration -->
  <rect x="58" y="394" width="400" height="44" rx="4" fill="#e7eff5"/>
  <path d="M 58 402 Q 108 394 158 402 T 258 402 T 358 402 T 458 402" fill="none" stroke="#235884" stroke-width="1.2" opacity="0.5"/>
  <path d="M 58 420 Q 108 412 158 420 T 258 420 T 358 420 T 458 420" fill="none" stroke="#235884" stroke-width="1" opacity="0.35"/>

  <!-- Boat 1: Elephant -->
  <g transform="translate(82, 314)">
    <!-- Elephant body -->
    <rect x="26" y="16" width="76" height="42" rx="18" fill="#bdb6aa" stroke="#4a4640" stroke-width="1.4"/>
    <!-- Head & trunk -->
    <circle cx="104" cy="30" r="17" fill="#bdb6aa" stroke="#4a4640" stroke-width="1.4"/>
    <path d="M 118 32 Q 128 46 122 64" fill="none" stroke="#4a4640" stroke-width="5" stroke-linecap="round"/>
    <path d="M 118 32 Q 128 46 122 64" fill="none" stroke="#bdb6aa" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="108" cy="27" r="2" fill="#191816"/>
    <!-- Ear -->
    <ellipse cx="95" cy="31" rx="8" ry="12" fill="#aba396" stroke="#4a4640" stroke-width="1.1"/>
    <!-- Legs -->
    <rect x="36" y="54" width="12" height="22" rx="3" fill="#bdb6aa" stroke="#4a4640" stroke-width="1.3"/>
    <rect x="54" y="54" width="12" height="22" rx="3" fill="#bdb6aa" stroke="#4a4640" stroke-width="1.3"/>
    <rect x="78" y="54" width="12" height="22" rx="3" fill="#bdb6aa" stroke="#4a4640" stroke-width="1.3"/>
    <!-- Boat hull -->
    <path d="M 6 74 L 136 74 L 122 96 L 20 96 Z" fill="#c79b6b" stroke="#4a4640" stroke-width="1.5"/>
    <line x1="12" y1="84" x2="130" y2="84" stroke="#9e3321" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="71" y="8" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#9e3321">大象直接称不了 → 3300 kg</text>
  </g>

  <!-- Equals sign -->
  <text x="256" y="380" text-anchor="middle" font-family="'Newsreader', 'Noto Serif SC', Georgia, serif" font-size="26" font-weight="700" fill="#191816">=</text>

  <!-- Boat 2: Stones -->
  <g transform="translate(284, 314)">
    <!-- Bottom row: 3 big stones (600kg) -->
    <ellipse cx="38" cy="66" rx="18" ry="10" fill="#8f8b84" stroke="#4a4640" stroke-width="1.2"/>
    <ellipse cx="74" cy="66" rx="18" ry="10" fill="#8f8b84" stroke="#4a4640" stroke-width="1.2"/>
    <ellipse cx="110" cy="66" rx="18" ry="10" fill="#8f8b84" stroke="#4a4640" stroke-width="1.2"/>
    <!-- Middle row: 4 medium stones (300kg) -->
    <ellipse cx="34" cy="50" rx="13" ry="8" fill="#a8a39b" stroke="#4a4640" stroke-width="1.1"/>
    <ellipse cx="60" cy="50" rx="13" ry="8" fill="#a8a39b" stroke="#4a4640" stroke-width="1.1"/>
    <ellipse cx="86" cy="50" rx="13" ry="8" fill="#a8a39b" stroke="#4a4640" stroke-width="1.1"/>
    <ellipse cx="112" cy="50" rx="13" ry="8" fill="#a8a39b" stroke="#4a4640" stroke-width="1.1"/>
    <!-- Top row: 6 small stones (50kg) -->
    <ellipse cx="34" cy="36" rx="8" ry="5.5" fill="#c2bdb4" stroke="#4a4640" stroke-width="1"/>
    <ellipse cx="50" cy="36" rx="8" ry="5.5" fill="#c2bdb4" stroke="#4a4640" stroke-width="1"/>
    <ellipse cx="66" cy="36" rx="8" ry="5.5" fill="#c2bdb4" stroke="#4a4640" stroke-width="1"/>
    <ellipse cx="82" cy="36" rx="8" ry="5.5" fill="#c2bdb4" stroke="#4a4640" stroke-width="1"/>
    <ellipse cx="98" cy="36" rx="8" ry="5.5" fill="#c2bdb4" stroke="#4a4640" stroke-width="1"/>
    <ellipse cx="114" cy="36" rx="8" ry="5.5" fill="#c2bdb4" stroke="#4a4640" stroke-width="1"/>
    <!-- Boat hull -->
    <path d="M 6 74 L 142 74 L 128 96 L 20 96 Z" fill="#c79b6b" stroke="#4a4640" stroke-width="1.5"/>
    <line x1="12" y1="84" x2="136" y2="84" stroke="#9e3321" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="74" y="18" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#235884">石头一块块能称（吃水线齐平）</text>
  </g>
  <text x="258" y="466" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">石头一乘一加，就量出了大象的体重</text>

  <!-- Right panel: Master equation + 6-card roadmap -->
  <rect x="496" y="88" width="428" height="142" rx="8" fill="#fbf8f2" stroke="#b8ae9c" stroke-width="1.2"/>
  <text x="710" y="114" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#9e3321">AI 里算得最多的运算，就是中间这个点</text>
  <text x="710" y="156" text-anchor="middle" font-family="'Newsreader', 'Noto Serif SC', Georgia, serif" font-size="28" font-weight="700" fill="#191816">
    <tspan fill="#235884" font-style="italic">x</tspan>
    <tspan fill="#9e3321"> · </tspan>
    <tspan fill="#9e3321" font-style="italic">y</tspan>
    <tspan> = Σ</tspan><tspan font-style="italic">x</tspan><tspan font-size="16" dy="5">i</tspan><tspan dy="-5" font-style="italic">y</tspan><tspan font-size="16" dy="5">i</tspan><tspan dy="-5"> = ‖</tspan><tspan fill="#235884" font-style="italic">x</tspan><tspan>‖‖</tspan><tspan fill="#9e3321" font-style="italic">y</tspan><tspan>‖ cos θ</tspan>
  </text>
  <line x1="536" y1="176" x2="884" y2="176" stroke="#d8d0c1" stroke-dasharray="3 3"/>
  <text x="580" y="198" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">点积</text>
  <text x="688" y="198" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#235884">代数：对应乘加</text>
  <text x="820" y="198" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#9e3321">几何：长度与夹角</text>
  <text x="710" y="220" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#9e3321">全篇主线：拿一个向量，去量另一个</text>

  
    <rect x="508" y="248" width="194" height="68" rx="7" fill="#f4efe4" stroke="#d8d0c1"/>
    <rect x="508" y="248" width="4" height="68" rx="2" fill="#235884"/>
    <text x="524" y="270" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#191816">01 加权求和</text>
    <text x="524" y="289" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#4a4640">数量 × 单价累加</text>
    <text x="524" y="306" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#235884">32 元</text>
    <rect x="716" y="248" width="194" height="68" rx="7" fill="#f4efe4" stroke="#d8d0c1"/>
    <rect x="716" y="248" width="4" height="68" rx="2" fill="#9e3321"/>
    <text x="732" y="270" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#191816">02 一把尺子</text>
    <text x="732" y="289" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#4a4640">换尺子量不同属性</text>
    <text x="732" y="306" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#9e3321">坐标 = 读数</text>
    <rect x="508" y="328" width="194" height="68" rx="7" fill="#f4efe4" stroke="#d8d0c1"/>
    <rect x="508" y="328" width="4" height="68" rx="2" fill="#9e3321"/>
    <text x="524" y="350" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#191816">03 几何投影</text>
    <text x="524" y="369" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#4a4640">影子长 × 刻度密度</text>
    <text x="524" y="386" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#9e3321">‖x‖‖y‖ cos θ</text>
    <rect x="716" y="328" width="194" height="68" rx="7" fill="#f4efe4" stroke="#d8d0c1"/>
    <rect x="716" y="328" width="4" height="68" rx="2" fill="#256b45"/>
    <text x="732" y="350" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#191816">04 方向与夹角</text>
    <text x="732" y="369" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#4a4640">除掉长度只留方向</text>
    <text x="732" y="386" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#256b45">余弦 / 相关系数</text>
    <rect x="508" y="408" width="194" height="68" rx="7" fill="#f4efe4" stroke="#d8d0c1"/>
    <rect x="508" y="408" width="4" height="68" rx="2" fill="#235884"/>
    <text x="524" y="430" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#191816">05 长度与勾股</text>
    <text x="524" y="449" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#4a4640">拿自己当尺子量自己</text>
    <text x="524" y="466" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#235884">x · x = ‖x‖²</text>
    <rect x="716" y="408" width="194" height="68" rx="7" fill="#f4efe4" stroke="#d8d0c1"/>
    <rect x="716" y="408" width="4" height="68" rx="2" fill="#b36b16"/>
    <text x="732" y="430" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#191816">06 矩阵与网络</text>
    <text x="732" y="449" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#4a4640">一摞尺子并行打分</text>
    <text x="732" y="466" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#b36b16">Wx + b</text>

</svg>
