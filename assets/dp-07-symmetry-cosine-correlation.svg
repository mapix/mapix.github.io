<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="点积对称性、余弦相似度与皮尔逊相关系数三阶演化图">
  <title>点积对称性、余弦相似度与皮尔逊相关系数三阶演化图</title>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#235884"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#9e3321"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4a4640"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#787167"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#256b45"/>
    </marker>
    
  </defs>
  <rect x="0.5" y="0.5" width="959" height="499" rx="10" fill="#fbf8f2" stroke="#d8d0c1"/>
  
  <text x="36" y="28" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#787167">FIG 07 · SYMMETRY → COSINE SIMILARITY → CORRELATION</text>
  <text x="36" y="54" font-family="'Newsreader', 'Noto Serif SC', Georgia, serif" font-size="21" font-weight="700" fill="#191816">三阶演化：谁当尺子都一样 → 除掉长度只比方向 → 减去均值即相关系数</text>
  <line x1="36" y1="68" x2="924" y2="68" stroke="#d8d0c1" stroke-width="1"/>

  <!-- Col 1: Symmetry -->
  <rect x="36" y="88" width="286" height="380" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
  <text x="52" y="114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#191816">① 对称性：互为尺子</text>
  <text x="52" y="134" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#787167">x · y = y · x = 13</text>

  <!-- Mini diagram col 1 -->
  <line x1="184.0" y1="278.0" x2="97.1" y2="243.2" stroke="#235884" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="128.0" y1="166.0" x2="157.6" y2="284.6" stroke="#9e3321" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="72" y1="306" x2="97.1" y2="243.2" stroke="#235884" stroke-width="4.5" opacity="0.35" stroke-linecap="round"/>
  <line x1="72" y1="306" x2="157.6" y2="284.6" stroke="#9e3321" stroke-width="4.5" opacity="0.35" stroke-linecap="round"/>
  <line x1="72" y1="306" x2="128.0" y2="166.0" stroke="#9e3321" stroke-width="2.2" marker-end="url(#arr-red)"/>
  <line x1="72" y1="306" x2="184.0" y2="278.0" stroke="#235884" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <circle cx="72" cy="306" r="3.5" fill="#191816"/>
  <text x="136.0" y="170.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#9e3321">y</text>
  <text x="192.0" y="282.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#235884">x</text>

  <rect x="52" y="330" width="254" height="122" rx="6" fill="#fbf8f2" stroke="#d8d0c1"/>
  <text x="64" y="354" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9e3321">拿 y 当尺子量 x：</text>
  <text x="64" y="374" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#4a4640">2.41 × 5.39 ≈ 13</text>
  <line x1="64" y1="388" x2="294" y2="388" stroke="#d8d0c1" stroke-dasharray="3 3"/>
  <text x="64" y="410" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#235884">反过来拿 x 量 y：</text>
  <text x="64" y="430" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#4a4640">3.15 × 4.12 ≈ 13</text>

  <!-- Col 2: Cosine similarity -->
  <rect x="336" y="88" width="288" height="380" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
  <text x="352" y="114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#191816">② 除掉长度：余弦相似度</text>
  <text x="352" y="134" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9e3321">y 变 2y：点积 13→26，cos θ 仍是 0.59</text>

  <!-- Unit circle -->
  <circle cx="480" cy="246" r="62" fill="#fbf8f2" stroke="#b8ae9c" stroke-dasharray="4 3" stroke-width="1.3"/>
  <text x="422" y="196" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="10.5" fill="#787167">单位圆 r=1</text>
  <!-- Extended 2y ghost -->
  <line x1="480" y1="246" x2="514.1" y2="160.8" stroke="#9e3321" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="520.1" y="164.8" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#9e3321" opacity="0.75">2y</text>
  <!-- Normalized arrows -->
  <line x1="480" y1="246" x2="503.0" y2="188.4" stroke="#9e3321" stroke-width="2.4" marker-end="url(#arr-red)"/>
  <line x1="480" y1="246" x2="540.1" y2="231.0" stroke="#235884" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <circle cx="480" cy="246" r="3.5" fill="#191816"/>
  <text x="487.0" y="202.4" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#9e3321">ŷ</text>
  <text x="548.1" y="235.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#235884">x̂</text>

  <!-- [-1, 1] gauge -->
  <line x1="372" y1="336" x2="588" y2="336" stroke="#4a4640" stroke-width="1.6"/>
  <line x1="372" y1="330" x2="372" y2="342" stroke="#4a4640" stroke-width="1.5"/>
  <line x1="480" y1="330" x2="480" y2="342" stroke="#4a4640" stroke-width="1.5"/>
  <line x1="588" y1="330" x2="588" y2="342" stroke="#4a4640" stroke-width="1.5"/>
  <circle cx="543.7" cy="336" r="5.5" fill="#9e3321"/>
  <text x="372" y="357" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#787167">-1</text>
  <text x="480" y="357" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#787167">0</text>
  <text x="588" y="357" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#787167">+1</text>

  <rect x="352" y="372" width="256" height="80" rx="6" fill="#fbf8f2" stroke="#d8d0c1"/>
  <text x="480" y="400" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#9e3321">cos θ = (x · y) / (‖x‖ ‖y‖)</text>
  <text x="480" y="424" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">长度除掉、单位约没，只剩纯方向</text>
  <text x="480" y="443" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#787167">RAG / Embedding 检索核心指标</text>

  <!-- Col 3: Pearson correlation -->
  <rect x="638" y="88" width="286" height="380" rx="8" fill="#e6f2ec" stroke="#256b45" stroke-width="1.3"/>
  <text x="654" y="114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#256b45">③ 先减均值：皮尔逊相关系数</text>
  <text x="654" y="134" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#4a4640">去中心化后的余弦相似度</text>

  <!-- 4-day example card -->
  <rect x="654" y="152" width="254" height="122" rx="6" fill="#fbf8f2" stroke="#d8d0c1"/>
  <text x="666" y="174" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#191816">4 天示例（≥3 维才有意义）：</text>
  <text x="666" y="196" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#235884">气温 x = [20, 24, 28, 32] (均 26)</text>
  <text x="666" y="216" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9e3321">销量 y = [10, 15, 21, 26] (均 18)</text>
  <line x1="666" y1="228" x2="896" y2="228" stroke="#d8d0c1" stroke-dasharray="3 3"/>
  <text x="666" y="248" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#235884">x' = x-x̄ = [-6, -2, +2, +6]</text>
  <text x="666" y="266" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9e3321">y' = y-ȳ = [-8, -3, +3, +8]</text>

  <!-- Arrow down -->
  <line x1="781" y1="274" x2="781" y2="306" stroke="#256b45" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="792" y="295" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="11.5" fill="#256b45">再做余弦相似度</text>

  <!-- Correlation formula card -->
  <rect x="654" y="314" width="254" height="138" rx="6" fill="#fbf8f2" stroke="#256b45" stroke-width="1.4"/>
  <text x="781" y="344" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#256b45">r = (x' · y') / (‖x'‖ ‖y'‖)</text>
  <text x="781" y="370" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#4a4640">= 108 / (√80 · √146) ≈ 0.999</text>
  <line x1="670" y1="386" x2="892" y2="386" stroke="#d8d0c1"/>
  <text x="781" y="408" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">统计学里一长串相关系数公式，</text>
  <text x="781" y="428" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#256b45">几何本质 = 波动向量的夹角余弦</text>

</svg>
