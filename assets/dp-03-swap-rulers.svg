<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="同一篮水果更换价目表、热量表与标准基三把尺子的测量对照">
  <title>同一篮水果更换价目表、热量表与标准基三把尺子的测量对照</title>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#235884"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#9e3321"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4a4640"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#787167"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#256b45"/>
    </marker>
    
  </defs>
  <rect x="0.5" y="0.5" width="959" height="479" rx="10" fill="#fbf8f2" stroke="#d8d0c1"/>
  
  <text x="36" y="28" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#787167">FIG 03 · SWAPPING RULERS</text>
  <text x="36" y="54" font-family="'Newsreader', 'Noto Serif SC', Georgia, serif" font-size="21" font-weight="700" fill="#191816">同一篮水果，换三把尺子：价目表、热量表，以及「坐标本身」</text>
  <line x1="36" y1="68" x2="924" y2="68" stroke="#d8d0c1" stroke-width="1"/>

  <!-- Left: Fixed basket -->
  <rect x="36" y="138" width="234" height="252" rx="10" fill="#e7eff5" stroke="#235884" stroke-width="1.5"/>
  <text x="153" y="168" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#235884">FIXED OBJECT · 被量的篮子</text>

  <!-- Basket icon -->
  <g transform="translate(88, 186)">
    <!-- Fruits -->
    <circle cx="38" cy="30" r="14" fill="#c94b3b" stroke="#4a4640" stroke-width="1.2"/>
    <circle cx="64" cy="24" r="13" fill="#89a853" stroke="#4a4640" stroke-width="1.2"/>
    <circle cx="90" cy="30" r="14" fill="#de8b35" stroke="#4a4640" stroke-width="1.2"/>
    <circle cx="50" cy="42" r="13" fill="#89a853" stroke="#4a4640" stroke-width="1.2"/>
    <circle cx="78" cy="42" r="13" fill="#de8b35" stroke="#4a4640" stroke-width="1.2"/>
    <!-- Basket trapezoid -->
    <path d="M 16 44 L 112 44 L 98 92 L 30 92 Z" fill="#d9b98b" stroke="#4a4640" stroke-width="1.5"/>
    <line x1="22" y1="60" x2="106" y2="60" stroke="#4a4640" stroke-width="0.9" opacity="0.5"/>
    <line x1="26" y1="76" x2="102" y2="76" stroke="#4a4640" stroke-width="0.9" opacity="0.5"/>
    <line x1="48" y1="44" x2="52" y2="92" stroke="#4a4640" stroke-width="0.9" opacity="0.5"/>
    <line x1="80" y1="44" x2="76" y2="92" stroke="#4a4640" stroke-width="0.9" opacity="0.5"/>
  </g>
  <text x="153" y="316" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#235884">x = (1, 2, 3)</text>
  <text x="153" y="342" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" fill="#4a4640">1 个苹果 · 2 个梨 · 3 个橙子</text>
  <text x="153" y="368" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#787167">果篮本身纹丝不动</text>

  <!-- Connecting curves to 3 rulers -->
  <path d="M 270 218 C 316 218, 316 146, 360 146" fill="none" stroke="#4a4640" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <path d="M 270 264 L 360 264" fill="none" stroke="#4a4640" stroke-width="1.6" marker-end="url(#arr-ink)"/>
  <path d="M 270 310 C 316 310, 316 382, 360 382" fill="none" stroke="#4a4640" stroke-width="1.6" marker-end="url(#arr-ink)"/>

  <!-- Ruler 1: Price -->
  <g transform="translate(368, 96)">
    <rect x="0" y="0" width="556" height="98" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
    <!-- Ruler strip -->
    <rect x="16" y="14" width="248" height="70" rx="6" fill="#f7e8e5" stroke="#9e3321" stroke-width="1.3"/>
    <text x="28" y="34" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9e3321">尺子 ① 价目表（元/个）</text>
    <!-- Ticks along top edge -->
    <path d="M 32 14 v 6 M 56 14 v 4 M 80 14 v 6 M 104 14 v 4 M 128 14 v 6 M 152 14 v 4 M 176 14 v 6 M 200 14 v 4 M 224 14 v 6 M 248 14 v 4" stroke="#9e3321" stroke-width="1" opacity="0.5"/>
    <text x="140" y="68" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#9e3321">[  4    5    6  ]</text>
    <!-- Calculation & Result -->
    <text x="282" y="42" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#4a4640">1×4 + 2×5 + 3×6</text>
    <text x="282" y="70" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#787167">把一篮水果量成「多少钱」</text>
    <line x1="428" y1="50" x2="454" y2="50" stroke="#9e3321" stroke-width="1.6" marker-end="url(#arr-red)"/>
    <rect x="462" y="24" width="80" height="50" rx="6" fill="#fbf8f2" stroke="#9e3321" stroke-width="1.6"/>
    <text x="502" y="56" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#9e3321">32 元</text>
  </g>

  <!-- Ruler 2: Calories -->
  <g transform="translate(368, 214)">
    <rect x="0" y="0" width="556" height="98" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
    <rect x="16" y="14" width="248" height="70" rx="6" fill="#f8efe0" stroke="#b36b16" stroke-width="1.3"/>
    <text x="28" y="34" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b36b16">尺子 ② 热量表（大卡/个，约）</text>
    <path d="M 32 14 v 6 M 56 14 v 4 M 80 14 v 6 M 104 14 v 4 M 128 14 v 6 M 152 14 v 4 M 176 14 v 6 M 200 14 v 4 M 224 14 v 6 M 248 14 v 4" stroke="#b36b16" stroke-width="1" opacity="0.5"/>
    <text x="140" y="68" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#b36b16">[ 95   100   60 ]</text>
    <text x="282" y="42" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#4a4640">1×95 + 2×100 + 3×60</text>
    <text x="282" y="70" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#787167">把同一篮量成「多少大卡」</text>
    <line x1="428" y1="50" x2="454" y2="50" stroke="#b36b16" stroke-width="1.6" marker-end="url(#arr-ink)"/>
    <rect x="462" y="24" width="80" height="50" rx="6" fill="#fbf8f2" stroke="#b36b16" stroke-width="1.6"/>
    <text x="502" y="55" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#b36b16">475大卡</text>
  </g>

  <!-- Ruler 3: Standard basis (1, 0, 0) -->
  <g transform="translate(368, 332)">
    <rect x="0" y="0" width="556" height="114" rx="8" fill="#e6f2ec" stroke="#256b45" stroke-width="1.4"/>
    <rect x="16" y="14" width="248" height="70" rx="6" fill="#fbf8f2" stroke="#256b45" stroke-width="1.3"/>
    <text x="28" y="34" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#256b45">尺子 ③ 只数苹果（标准基 e₁）</text>
    <text x="140" y="68" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#256b45">[  1    0    0  ]</text>
    <text x="282" y="42" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#4a4640">1×1 + 2×0 + 3×0</text>
    <text x="282" y="68" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#256b45">读数 1 = x 的第 1 个坐标！</text>
    <line x1="428" y1="49" x2="454" y2="49" stroke="#256b45" stroke-width="1.6" marker-end="url(#arr-green)"/>
    <rect x="462" y="23" width="80" height="50" rx="6" fill="#fbf8f2" stroke="#256b45" stroke-width="1.6"/>
    <text x="502" y="55" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#256b45">1 个</text>
    <text x="278" y="103" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#256b45">顿悟：我们以为天经地义的「坐标」，本质上也是拿 (1,0,0)、(0,1,0)、(0,0,1) 这三把标准尺子量出来的。</text>
  </g>

</svg>
