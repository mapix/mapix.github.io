<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="点积正零负符号与勾股定理四象限原理图">
  <title>点积正零负符号与勾股定理四象限原理图</title>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#235884"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#9e3321"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#4a4640"/>
    </marker>
    <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#787167"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#256b45"/>
    </marker>
    
  </defs>
  <rect x="0.5" y="0.5" width="959" height="519" rx="10" fill="#fbf8f2" stroke="#d8d0c1"/>
  
  <text x="36" y="28" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#787167">FIG 05 · SIGN, ORTHOGONALITY &amp; PYTHAGORAS</text>
  <text x="36" y="54" font-family="'Newsreader', 'Noto Serif SC', Georgia, serif" font-size="21" font-weight="700" fill="#191816">旋转尺子：正、零、负三种符号，以及拿自己量自己推出勾股定理</text>
  <line x1="36" y1="68" x2="924" y2="68" stroke="#d8d0c1" stroke-width="1"/>

  <g transform="translate(36, 88)">
    <rect x="0" y="0" width="436" height="190" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
    <text x="16" y="25" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#191816">① 同向（锐角）</text>
    <rect x="316" y="9" width="106" height="22" rx="4" fill="#e6f2ec"/>
    <text x="369" y="24" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#256b45">读数为正 (+)</text>
    
    <line x1="24" y1="146" x2="260" y2="146" stroke="#b8ae9c" stroke-width="1"/>
    <line x1="100" y1="176" x2="100" y2="44" stroke="#b8ae9c" stroke-width="1"/>
    <line x1="204.0" y1="120.0" x2="155.8" y2="79.5" stroke="#235884" stroke-width="1.3" stroke-dasharray="4 3"/>
    <line x1="100" y1="146" x2="155.8" y2="79.5" stroke="#235884" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
    <line x1="100" y1="146" x2="153.5" y2="82.3" stroke="#9e3321" stroke-width="2.2" marker-end="url(#arr-red)"/>
    <line x1="100" y1="146" x2="204.0" y2="120.0" stroke="#235884" stroke-width="2.2" marker-end="url(#arr-blue)"/>
    <circle cx="100" cy="146" r="3" fill="#191816"/>
    <text x="210.0" y="124.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#235884">x</text>
    <text x="159.5" y="86.3" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#9e3321">y</text>
    <text x="274" y="76" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#256b45">夹角 θ &lt; 90°</text>
    <text x="274" y="100" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">影子落在尺子正面</text>
    <text x="274" y="122" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">两支箭头大致同向</text>
    <text x="274" y="150" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#256b45">x · y &gt; 0</text>

  </g>
  <g transform="translate(488, 88)">
    <rect x="0" y="0" width="436" height="190" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
    <text x="16" y="25" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#191816">② 垂直（90°）</text>
    <rect x="316" y="9" width="106" height="22" rx="4" fill="#fbf8f2"/>
    <text x="369" y="24" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#191816">读数为零 (0)</text>
    
    <line x1="24" y1="146" x2="260" y2="146" stroke="#b8ae9c" stroke-width="1"/>
    <line x1="115" y1="176" x2="115" y2="44" stroke="#b8ae9c" stroke-width="1"/>
    <path d="M 124.7 143.6 L 122.3 133.9 L 112.6 136.3" fill="none" stroke="#4a4640" stroke-width="1.2"/>
    <line x1="115" y1="146" x2="92.9" y2="57.7" stroke="#9e3321" stroke-width="2.2" marker-end="url(#arr-red)"/>
    <line x1="115" y1="146" x2="219.0" y2="120.0" stroke="#235884" stroke-width="2.2" marker-end="url(#arr-blue)"/>
    <circle cx="115" cy="146" r="4.5" fill="#9e3321"/>
    <text x="225.0" y="124.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#235884">x</text>
    <text x="100.9" y="61.7" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#9e3321">y (垂直)</text>
    <text x="274" y="76" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#191816">夹角 θ = 90°（正交）</text>
    <text x="274" y="100" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">影子缩成原点一个点</text>
    <text x="274" y="122" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">尺子对 x 毫无感觉</text>
    <text x="274" y="150" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#191816">x · y = 0</text>

  </g>
  <g transform="translate(36, 292)">
    <rect x="0" y="0" width="436" height="190" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
    <text x="16" y="25" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#191816">③ 背面（钝角 / 反向）</text>
    <rect x="316" y="9" width="106" height="22" rx="4" fill="#f7e8e5"/>
    <text x="369" y="24" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#9e3321">读数为负 (-)</text>
    
    <line x1="24" y1="114" x2="258" y2="114" stroke="#b8ae9c" stroke-width="1"/>
    <line x1="140" y1="176" x2="140" y2="48" stroke="#b8ae9c" stroke-width="1"/>
    <line x1="140" y1="114" x2="236.0" y2="90.0" stroke="#9e3321" stroke-width="5" opacity="0.22" stroke-linecap="round"/>
    <line x1="140" y1="114" x2="88.8" y2="126.8" stroke="#9e3321" stroke-width="2.4" marker-end="url(#arr-red)"/>
    <line x1="140" y1="114" x2="236.0" y2="90.0" stroke="#235884" stroke-width="2.2" marker-end="url(#arr-blue)"/>
    <circle cx="140" cy="114" r="3.5" fill="#191816"/>
    <text x="232.0" y="80.0" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#235884">x = (4, 1)</text>
    <text x="86.8" y="142.8" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9e3321">y (反向单位尺)</text>
    <text x="274" y="76" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#9e3321">夹角 θ &gt; 90°（背面）</text>
    <text x="274" y="100" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">影子落在尺子反方向</text>
    <text x="274" y="122" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">完全反向时 = -‖x‖</text>
    <text x="274" y="150" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#9e3321">x · y ≈ -4.12</text>

  </g>
  <g transform="translate(488, 292)">
    <rect x="0" y="0" width="436" height="190" rx="8" fill="#f4efe4" stroke="#d8d0c1"/>
    <text x="16" y="25" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#191816">④ 拿篮子自己当尺子</text>
    <rect x="316" y="9" width="106" height="22" rx="4" fill="#e7eff5"/>
    <text x="369" y="24" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#235884">x·x = ‖x‖² = 17</text>
    
    <!-- Right triangle showing 4 and 1 -->
    <polygon points="48,148 216.0,148 216.0,106.0" fill="#e7eff5" stroke="none"/>
    <line x1="48" y1="148" x2="216.0" y2="148" stroke="#4a4640" stroke-width="1.3" stroke-dasharray="4 3"/>
    <line x1="216.0" y1="148" x2="216.0" y2="106.0" stroke="#4a4640" stroke-width="1.3" stroke-dasharray="4 3"/>
    <path d="M 207.0 148 L 207.0 139 L 216.0 139" fill="none" stroke="#4a4640" stroke-width="1.1"/>
    <!-- Ruler band along x -->
    <line x1="48" y1="148" x2="216.0" y2="106.0" stroke="#235884" stroke-width="9" opacity="0.22" stroke-linecap="round"/>
    <line x1="48" y1="148" x2="216.0" y2="106.0" stroke="#235884" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <circle cx="48" cy="148" r="3.5" fill="#191816"/>
    <text x="132.0" y="166" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#4a4640">4</text>
    <text x="228.0" y="131.0" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#4a4640">1</text>
    <text x="124.0" y="113.0" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#235884">‖x‖ = √17</text>

    <text x="248" y="70" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#4a4640">小票：4×4 + 1×1 = 17</text>
    <text x="248" y="94" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#4a4640">尺子：√17 × √17 = 17</text>
    <line x1="248" y1="108" x2="420" y2="108" stroke="#d8d0c1"/>
    <text x="248" y="132" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#235884">x · x = ‖x‖² = 4² + 1²</text>
    <text x="248" y="156" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" fill="#4a4640">长度 = 拿自己量自己再开方</text>

  </g>
</svg>
