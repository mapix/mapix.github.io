  <text x="376" y="431" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#235884">影子长 = 2.41 · 尺长 = 5.39</text>
  <text x="376" y="454" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#4a4640">读数 = 2.41 × 5.39 ≈ <tspan font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-weight="700" fill="#9e3321">13 元</tspan></text>

  <!-- Panel C: Mechanism explainer -->
  <rect x="682" y="88" width="242" height="398" rx="8" fill="#fbf8f2" stroke="#b8ae9c" stroke-width="1.2"/>
  <text x="700" y="116" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#9e3321">WHY DENSER TICKS?</text>
  <text x="700" y="142" font-family="'Newsreader', 'Noto Serif SC', Georgia, serif" font-size="17" font-weight="700" fill="#191816">刻度变密的秘密</text>
  <line x1="700" y1="154" x2="906" y2="154" stroke="#d8d0c1"/>

  <text x="700" y="182" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#4a4640">沿尺子方向每走 1 几何单位，</text>
  <text x="700" y="202" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#4a4640">点积读数跳升 <tspan font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-weight="700" fill="#9e3321">‖y‖</tspan> 格。</text>

  <text x="700" y="236" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#4a4640">反过来，每增加 1 格读数，</text>
  <text x="700" y="256" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#4a4640">在尺身上只需要走：</text>

  <rect x="700" y="270" width="206" height="44" rx="6" fill="#f7e8e5" stroke="#9e3321" stroke-opacity="0.4"/>
  <text x="803" y="298" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#9e3321">格距 = 1 / ‖y‖</text>

  <text x="700" y="340" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#4a4640">所以尺子箭头越长，单位长度</text>
  <text x="700" y="360" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12.5" fill="#4a4640">塞进的刻度越多（密度 = ‖y‖）：</text>

  <rect x="700" y="376" width="206" height="92" rx="6" fill="#f4efe4" stroke="#d8d0c1"/>
  <text x="803" y="400" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#191816">最终刻度读数</text>
  <text x="803" y="424" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" fill="#235884">影子长 (‖x‖ cos θ)</text>
  <text x="803" y="442" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#787167">×</text>
  <text x="803" y="460" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13" fill="#9e3321">刻度密度 (‖y‖)</text>

</svg>
