  <text x="364" y="114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#191816">② 价目表尺子 y = (2, 5)</text>
  <text x="364" y="134" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9e3321">‖y‖ = √29 ≈ 5.39 · 每 1 元间距仅 0.186</text>

