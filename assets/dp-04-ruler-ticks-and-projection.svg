idth="0.85"/><line x1="480.3" y1="256.3" x2="473.8" y2="253.7" stroke="#9e3321" stroke-width="0.85"/><line x1="483.2" y1="249.1" x2="476.7" y2="246.5" stroke="#9e3321" stroke-width="0.85"/><line x1="490.3" y1="243.5" x2="479.6" y2="239.2" stroke="#9e3321" stroke-width="1.4"/><text x="462.4" y="236.4" text-anchor="end" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9e3321">20</text><line x1="489.0" y1="234.6" x2="482.5" y2="232.0" stroke="#9e3321" stroke-width="0.85"/><line x1="491.9" y1="227.4" x2="485.4" y2="224.8" stroke="#9e3321" stroke-width="0.85"/><line x1="494.8" y1="220.1" x2="488.3" y2="217.5" stroke="#9e3321" stroke-width="0.85"/><line x1="497.7" y1="212.9" x2="491.2" y2="210.3" stroke="#9e3321" stroke-width="0.85"/><line x1="504.8" y1="207.3" x2="494.1" y2="203.0" stroke="#9e3321" stroke-width="1.4"/><text x="476.9" y="200.2" text-anchor="end" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#9e3321">25</text><line x1="503.5" y1="198.4" x2="497.0" y2="195.8" stroke="#9e3321" stroke-width="0.85"/><line x1="506.4" y1="191.2" x2="499.9" y2="188.6" stroke="#9e3321" stroke-width="0.85"/><line x1="509.3" y1="183.9" x2="502.8" y2="181.3" stroke="#9e3321" stroke-width="0.85"/>

