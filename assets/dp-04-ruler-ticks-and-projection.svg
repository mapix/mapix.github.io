  <text x="36" y="28" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#787167">FIG 04 · GEOMETRIC RULER &amp; TICK DENSITY</text>
  <text x="36" y="54" font-family="'Newsreader', 'Noto Serif SC', Georgia, serif" font-size="21" font-weight="700" fill="#191816">几何核心机制：为什么尺子箭头越长，刻度反而越密？</text>
